# Included in every location that forwards to the backend. $backend (server block) and $forwarded_* (maps)
# are defined in default.conf.template, since only the template is rendered by envsubst. proxy_pass with a
# variable and no URI forwards the request path unchanged.
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $forwarded_host;
# An empty value is not sent, so X-Forwarded-Port only reaches the backend if an outer proxy set it.
proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
