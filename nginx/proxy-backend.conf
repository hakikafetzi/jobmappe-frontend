# Included in every location that forwards to the backend. $backend is set in the server block, because
# only the template is rendered by envsubst. proxy_pass with a variable and no URI forwards the request
# path unchanged.
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
