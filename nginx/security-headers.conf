# Included in the server block and in every location with its own add_header, because add_header in a
# location drops all inherited ones. No Content-Security-Policy: index.html has an inline script that sets
# the theme before the first paint.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
