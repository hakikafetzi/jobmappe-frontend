<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Erscheinungsbild und Animationen vor dem ersten Rendern setzen (kein Aufblitzen). Schlüssel und
      // Werte wie in src/shared/theme/theme.ts und motionPreference.ts.
      try {
        const theme = localStorage.getItem('jobmappe.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (localStorage.getItem('jobmappe.motion') === 'off') document.documentElement.dataset.motion = 'off'
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JobMappe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
